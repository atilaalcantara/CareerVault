services:
  career-vault-api:
    container_name: career-vault-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5000:8080"
    volumes:
      - ./models-cache:/app/.cache/local-embeddings
    restart: unless-stopped
    networks:
      - personal-net

networks:
  personal-net:
    external: true
